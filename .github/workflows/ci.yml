name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.11
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile package
        env:
          PYTHONPYCACHEPREFIX: ${{ github.workspace }}/build/python-cache
        run: python -m compileall -q alpine_llm
      - name: Smoke test CLI
        run: python -B -m alpine_llm.cli run --help > /dev/null

  android:
    name: Android modules
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Test, lint, and assemble
        run: >-
          ./gradlew
          :android:testDebugUnitTest
          :android:lintDebug
          :android:assembleDebugAndroidTest
          :android:assembleRelease
          :sample:assembleDebug
          :sample:lintDebug
          :demo-chatbot:testDebugUnitTest
          :demo-chatbot:assembleDebug
          :demo-chatbot:assembleDebugAndroidTest
          :demo-chatbot:lintDebug
          --no-daemon
          --stacktrace
