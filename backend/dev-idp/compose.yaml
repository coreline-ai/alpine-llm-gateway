services:
  keycloak:
    build:
      context: .
      dockerfile: Dockerfile
    image: mobileagent/keycloak-dev:26.7.0
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: mobileagent-local-admin
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9000:9000"
    restart: unless-stopped

# This fixture is for local contract tests only. Physical-device OAuth E2E must
# use a MobileAgent-owned HTTPS staging issuer and must not expose this dev admin.
