name: mobile_agent_auth
description: Native AppAuth, secure session vault, and authorized transport for MobileAgent.
version: 0.0.1
homepage: https://github.com/coreline-ai/flutter_mobile_agent

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: ai.coreline.mobile_agent_auth
        pluginClass: MobileAgentAuthPlugin
      ios:
        pluginClass: MobileAgentAuthPlugin
